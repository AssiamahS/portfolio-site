<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Notes - Liquid Vault</title>
    <link rel="stylesheet" href="notes-styles.css">
</head>
<body>
    <div class="liquid-bg">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <path class="wave1" fill="url(#gradient1)" fill-opacity="0.4" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,112C672,96,768,96,864,112C960,128,1056,160,1152,165.3C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
        <defs>
            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
            </linearGradient>
        </defs>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="vault-title">🌊 Liquid Vault</h1>
                <button class="btn-new-note" onclick="createNewNote()">+ New Note</button>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Search notes..." oninput="searchNotes(this.value)">
            </div>

            <div class="quick-actions">
                <button class="action-btn" onclick="createDailyNote()">📅 Daily Note</button>
                <button class="action-btn" onclick="showGraph()">🕸️ Graph View</button>
            </div>

            <div class="notes-list" id="notes-list">
                <!-- Notes will be listed here -->
            </div>
        </aside>

        <!-- Main Editor -->
        <main class="editor-container">
            <div class="editor-header">
                <input type="text" id="note-title" class="note-title-input" placeholder="Untitled Note">
                <div class="editor-actions">
                    <button class="icon-btn" onclick="togglePreview()" title="Toggle Preview">👁️</button>
                    <button class="icon-btn" onclick="deleteCurrentNote()" title="Delete Note">🗑️</button>
                </div>
            </div>

            <div class="editor-body">
                <div class="editor-pane">
                    <textarea id="markdown-editor" class="markdown-textarea" placeholder="Start writing...

# Heading 1
## Heading 2

- Bullet point
- [ ] Todo item

**Bold text**
*Italic text*

[[Link to another note]]"></textarea>
                </div>
                <div class="preview-pane" id="preview-pane">
                    <div id="markdown-preview" class="markdown-content"></div>
                </div>
            </div>
        </main>

        <!-- Graph Modal -->
        <div class="modal" id="graph-modal">
            <div class="modal-content graph-modal-content">
                <div class="modal-header">
                    <h2>Note Graph</h2>
                    <button class="close-btn" onclick="closeGraph()">&times;</button>
                </div>
                <div id="graph-container" class="graph-container"></div>
            </div>
        </div>
    </div>

    <div class="cursor-liquid"></div>

    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="notes-script.js"></script>
</body>
</html>
